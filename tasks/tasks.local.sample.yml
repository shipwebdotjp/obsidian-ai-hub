# Task runner sample file
# Copy this file to tasks/tasks.local.yml and adjust the commands for your machine.
#
# Supported schedule types:
# - minutely
# - hourly
# - daily
# - weekly
# - monthly
#
# Schedule fields accept single numbers, lists, comma-separated strings,
# ranges like "8-18", stepped ranges like "*/15" or "8-18/2", and "*" where
# the field allows it.

- id: sample_minutely_every_30_seconds
  enabled: true
  schedule:
    type: minutely
    second: [0, 30]
  command: 'echo "This runs every minute at 0 and 30 seconds"'

# Per-minute Inbox merge. The task runner LaunchAgent already fires every 60s,
# so inbox files are normally merged within ~1 minute of save.
# Files updated within the last 5 seconds are deferred to the next run to
# avoid racing with in-progress writes (the grace is a single stat check,
# not a wait).
- id: merge_inbox
  enabled: true
  schedule:
    type: minutely
    second: 0
  command: 'uv --directory /path/to/obsidian-daily-merge run -m obsidian_ai_hub --merge-inbox'

- id: sample_hourly_basic
  enabled: true
  schedule:
    type: hourly
    minute: 0
  command: 'echo "This runs every hour at minute 0"'

- id: sample_hourly_multiple_minutes
  enabled: true
  schedule:
    type: hourly
    minute: "0,30"
  command: 'echo "This runs every hour at :00 and :30"'

- id: sample_daily_range
  enabled: true
  schedule:
    type: daily
    hour: "8-18/2"
    minute: 15
  command: 'echo "This runs every day at 08:15, 10:15, 12:15, 14:15, 16:15, and 18:15"'

- id: sample_weekly
  enabled: true
  schedule:
    type: weekly
    weekday: [1, 3, 5]
    hour: 9
    minute: 0
  command: 'echo "This runs on Monday, Wednesday, and Friday at 09:00"'

# Enable after creating a weekly-note template containing an empty `result::` line.
- id: review_draft_sunday_evening
  enabled: false
  schedule:
    type: weekly
    weekday: 6 # Sunday
    hour: 21
    minute: 30
  command: 'uv --directory /path/to/obsidian-daily-merge run -m obsidian_ai_hub --review-draft'

# Enable to create long-term-memory candidates from the most recently completed week.
- id: memory_extract_monday_early
  enabled: false
  schedule:
    type: weekly
    weekday: 0 # Monday
    hour: 0
    minute: 15
  command: 'uv --directory /path/to/obsidian-daily-merge run -m obsidian_ai_hub --memory-extract'

# Daily 06:00 AI planner proposal generation (low-to-medium confidence schedule/reminder candidates).
- id: generate_planner_proposals_daily
  enabled: false
  schedule:
    type: daily
    hour: 6
    minute: 0
  command: 'uv --directory /path/to/obsidian-daily-merge run -m obsidian_ai_hub --generate-planner-proposals'

- id: sample_monthly
  enabled: true
  schedule:
    type: monthly
    day: "1,15"
    hour: 8
    minute: 30
  command: 'echo "This runs on the 1st and 15th at 08:30"'

- id: sample_cd_chain
  enabled: false
  schedule:
    type: daily
    hour: 7
    minute: 0
  command: 'cd /path/to/project && python -m your_tool --flag "value"'

# Note: Hitl dispatch should be handled by the resident LaunchAgent (jp.shipweb.obsidian-ai-hub.hitl-worker).
# Do not enable hitl_dispatch_minutely when the resident worker is running.
# --hitl-dispatch is retained for manual recovery and troubleshooting only.
- id: hitl_dispatch_minutely
  enabled: false
  schedule:
    type: minutely
    second: [0, 30]
  command: 'uv --directory /path/to/obsidian-daily-merge run -m obsidian_ai_hub --hitl-dispatch'

- id: cleanup_line_webhooks_daily
  enabled: true
  schedule:
    type: daily
    hour: 3
    minute: 15
  command: 'uv --directory /path/to/obsidian-daily-merge run -m obsidian_ai_hub --cleanup-line-webhooks'

- id: cleanup_execution_logs_daily
  enabled: true
  schedule:
    type: daily
    hour: 3
    minute: 20
  command: 'uv --directory /path/to/obsidian-daily-merge run -m obsidian_ai_hub --cleanup-execution-logs'
