ai_log_path: /path/to/your/obsidian/copilot/copilot-jsons

vault:
  inbox: inbox
  daily: daily
  dashboard: dashboard
  template: template
  knowledge: copilot/knowledge
  research: research
  activity: activity

files:
  daily_note: daily.md
  weekly_template: Weekly Template.md
  research_candidate_theme_list: リサーチ候補テーマリスト.md

backup:
  sync_folders:
    - source: /path/to/your/obsidian/Default
      destination: /path/to/your/backup/Obsidian/Default
    - source: /path/to/your/obsidian/Inbox
      destination: /path/to/your/backup/Obsidian/Inbox
    - source: /path/to/your/documents
      destination: /path/to/your/backup/Documents
    - source: /path/to/your/share
      destination: /path/to/your/backup/Share

location_map:
  "芝公園4丁目2-8": "東京タワー"
  "有明3-11-1": "東京ビッグサイト"

regularly_date_events:
  - [[0], 0, "来月のノート作成", 1]
  - [[0], 0, "入金処理", 1]
  - [[1], 0, "月カレンダー更新", 1]
  - [[25], 0, "来月の予定を立てる", 1]

regularly_weekday_events:
  - [[1], ["土"], 0, "会議", 2]
  - [[1,2,3,4,5], ["木"], 0, "定例会", 2]

llm:
  make_today_target:
    provider: ollama
    model: glm-4.7:cloud
    prompt_path: /path/to/your/config/prompts/make_today_target.md
  # Optional override. When omitted, the make_today_target provider/model is used.
  review_draft:
    provider: ollama
    model: glm-4.7:cloud
    prompt_path: /path/to/your/config/prompts/review_draft.md
  # Example with opencode_go:
  # make_today_target:
  #   provider: opencode_go
  #   model: deepseek-v3  # OpenAI-compatible model
  #   # model: qwen3.7-72b  # Anthropic-compatible model
  inbox_audio_correction:
    provider: ollama
    model: gpt-oss:120b-cloud
  inbox_web_summary:
    provider: openai
    model: gpt-5.4
    prompt_path: /path/to/your/config/prompts/inbox_web_summary.md
  inbox_classification:
    provider: openai
    model: gpt-5.4
    prompt_path: /path/to/your/config/prompts/inbox_classification.md
  research:
    router:
      provider: openai
      model: gpt-5.4
      prompt_path: /path/to/your/config/prompts/research_router.md
    query_generation:
      provider: openai
      model: gpt-5.4
      prompt_path: /path/to/your/config/prompts/research_query_generation.md
    title_generation:
      provider: openai
      model: gpt-5.4
      prompt_path: /path/to/your/config/prompts/research_title.md
    internal:
      provider: openai
      model: gpt-5.4
      prompt_path: /path/to/your/config/prompts/research_internal.md
    web:
      provider: openai
      model: gpt-5.4
      prompt_path: /path/to/your/config/prompts/research_web.md
    deep:
      prompt_path: /path/to/your/config/prompts/research_deep.md
    theme_generation:
      provider: openai
      model: gpt-5.4
      prompt_path: /path/to/your/config/prompts/research_theme_generation.md

research:
  default_output_style: long
  context:
    lookback_days: 7
    max_notes: 3
  # Used only by deep mode (GPT Researcher).
  deep:
    gpt_researcher:
      retriever: tavily,mcp
      fast_llm: openai:gpt-5.6-terra
      smart_llm: openai:gpt-5.6-sol
      strategic_llm: openai:gpt-5.6-terra
      embedding: huggingface:cl-nagoya/ruri-v3-70m
      smart_token_limit: 16000
      browse_chunk_max_length: 8192
      language: japanese
  vectorsearch_dir: /path/to/your/vectorsearch
  vectorsearch_python: uv
  vectorsearch_script: your_vectorsearch_script

vault_index:
  collection_name: documents
  sqlite_path: /path/to/your/obsidian-ai-hub/vault-index/search.sqlite
  chroma_path: /path/to/your/obsidian-ai-hub/vault-index/chroma
  embedder_model: cl-nagoya/ruri-v3-310m
  allow_network_fallback: true
