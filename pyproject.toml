[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-ai-hub"
version = "0.1.0"
description = "Obsidian Daily Merge Tool"
authors = [{name = "Ship", email = "ship@shipweb.jp"}]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["src"]
