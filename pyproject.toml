[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-ai-hub"
version = "0.1.0"
description = "Obsidian Daily Merge Tool"
authors = [{name = "Ship", email = "ship@shipweb.jp"}]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "md-hybrid-search",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
md-hybrid-search = { path = "../md-hybrid-search", editable = true }
