[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-ai-hub"
version = "0.1.0"
description = "Obsidian Daily Merge Tool"
authors = [{name = "Ship", email = "ship@shipweb.jp"}]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "md-hybrid-search",
    "chromadb>=1.5.9",
    "langchain-core",
    "sentence-transformers",
    "pyobjc-core>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-EventKit>=11.0; sys_platform == 'darwin'",
    "openai-whisper",
    "fastmcp>=3.3.1",
    "langchain>=1.3.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.2.2",
    "langchain-tavily>=0.2.18",
    "langchain-mcp-adapters>=0.2.2",
    "gpt-researcher==0.16.1",
    "pyobjc-framework-vision>=12.1; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.1; sys_platform == 'darwin'",
    "wurlitzer>=3.1.1",
    "atomacos>=3.3.0; sys_platform == 'darwin'",
    "langchain-huggingface>=1.2.2",
    "langchain-anthropic",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pyyaml",
    "jinja2>=3.1",
    "youtube-transcript-api",
    "yt-dlp",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "grpcio==1.84.0",
    "pywebpush>=1.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
md-hybrid-search = { git = "https://github.com/shipwebdotjp/md-hybrid-search.git" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: browser end-to-end tests that require frontend/dist and Playwright Chromium",
]

[tool.ruff.lint.per-file-ignores]
# Pure re-export facade: imported names are part of the public import surface.
"src/obsidian_ai_hub/web/service.py" = ["F401"]

[dependency-groups]
dev = [
    "playwright>=1.61.0",
    "pytest>=9.0.3",
    "requests>=2.31.0",
]
